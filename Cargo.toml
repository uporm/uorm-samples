[package]
name = "uorm-samples"
version = "0.1.0"
edition = "2024"

[dependencies]
uorm = { version = "0.7.2", features = ["mysql"] }
rivus-core = { version = "0.5.0" }
rivus-logger = { version = "0.5.0" }

axum = "0.8.8"
axum-extra = {version = "0.12.5", features = ["query"]}
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tokio = "1.48.0"
anyhow = "1.0.100"
tracing = "0.1"
validator = { version = "0.20.0", features = ["derive"] }
sonyflake= "0.4.0"
thiserror = "2.0.17"
rust-i18n = "3.1.5"
moka = { version = "0.12.12", features = ["future"] }
inventory= "0.3.21"
async-trait = "0.1.89"
